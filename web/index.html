<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>爱思办公任务看板</title>
  <meta name="description" content="局域网只读查看电脑端任务进度的协同看板（非官方、免费、开源）" />
  <meta name="theme-color" content="#2563eb" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/icon-180.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="任务看板" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header id="topbar" class="hidden">
    <span id="top-title">任务列表</span>
    <span id="top-task" class="hidden"></span>
    <span id="net-status" class="chip hidden"></span>
    <button id="btn-expand-all" class="ghost" type="button">全部展开</button>
    <button id="btn-refresh" class="ghost" type="button">刷新</button>
  </header>

  <main>
    <!-- 连接页 -->
    <section id="view-connect" class="view">
      <div class="connect-card">
        <img class="logo" src="icons/icon-192.png" alt="应用图标" />
        <h1>爱思办公任务看板</h1>
        <p class="sub">非官方 · 免费 · 开源 · 只读 · 局域网</p>
        <div class="form">
          <label for="in-base">电脑地址</label>
          <input id="in-base" type="text" inputmode="url" autocomplete="off" placeholder="如 http://192.168.1.8:8787" />
          <label for="in-code">配对码</label>
          <input id="in-code" type="text" inputmode="numeric" maxlength="6" autocomplete="one-time-code" placeholder="6 位数字（见电脑端窗口）" />
          <button id="btn-connect" type="button">连接</button>
        </div>
        <ol class="hint">
          <li>电脑上运行桥接服务：<code>node bridge.js</code></li>
          <li>手机与电脑连接同一 WiFi</li>
          <li>输入电脑端显示的地址与 6 位配对码，或直接扫描电脑端二维码</li>
        </ol>
        <p class="note">本工具仅以只读方式查看任务进度，不会创建、修改或删除任何任务。</p>
      </div>
    </section>

    <!-- 任务列表页 -->
    <section id="view-list" class="view hidden">
      <div id="ptr"><span id="ptr-label">下拉刷新</span></div>
      <div id="acp-banner" class="hidden" style="margin:0 12px 10px;padding:12px 14px;border-radius:10px;background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;font-size:13px;line-height:1.6;">⚠ 未检测到爱思办公进程，取不到任务数据。请在电脑上启动爱思办公桌面应用，桥接服务会自动连接，无需重启。</div>
      <div id="task-list" class="cards"></div>
    </section>

    <!-- 任务详情页 -->
    <section id="view-detail" class="view hidden">
      <div id="detail-pin" class="hidden">
        <div class="pin-top">
          <button id="btn-back" class="back" type="button">← 返回任务列表</button>
        </div>
        <div id="pin-head"></div>
      </div>
      <div id="task-detail"></div>
    </section>
  </main>

  <!-- V2：详情页发消息输入栏（向 AI 任务发送确认/指令/修改建议） -->
  <form id="composer" class="hidden" autocomplete="off">
    <input id="msg-input" type="text" maxlength="4000" enterkeyhint="send"
           placeholder="发消息给这个任务，如：同意 / 继续 / 修改建议…" />
    <button id="btn-send" type="submit">发送</button>
  </form>

  <div id="toast" class="hidden"></div>
  <script src="app.js"></script>
</body>
</html>
